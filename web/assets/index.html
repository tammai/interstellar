<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Interstellar — Sky</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="style.css">
<link rel="preload" href="fonts/NotoSans-variable.woff2" as="font" type="font/woff2" crossorigin>
</head>
<body>

<header>
  <h1 class="wordmark"><span class="glyph" aria-hidden="true">✦</span>Interstellar</h1>
  <div class="obs-date" id="obsDate"></div>
  <div class="spacer"></div>
  <div class="view-toggle" role="tablist" aria-label="View">
    <button id="btnSky" class="active" role="tab" aria-selected="true" aria-controls="sky">Sky</button>
    <button id="btnList" role="tab" aria-selected="false" aria-controls="list">List</button>
  </div>
  <!-- A real link, not a router push: the chat screen is a separate document that
       loads none of the sky's code, which is the entire point of it. -->
  <a class="icon-btn" id="btnAsk" href="chat/" aria-label="Ask a question" title="Ask a question">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 9.7 9.7 0 0 1-2.6-.4L4 21l1.6-4.2A8.3 8.3 0 0 1 3.6 11.5a8.4 8.4 0 0 1 9-8.4 8.4 8.4 0 0 1 8.4 8.4z"/>
    </svg>
  </a>
  <button class="icon-btn" id="btnRefresh" aria-label="Refresh now" title="Refresh now">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/>
    </svg>
  </button>
  <button class="icon-btn" id="btnSettings" aria-label="Settings" aria-expanded="false" aria-haspopup="dialog">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="12" cy="12" r="3"/>
      <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h.01a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h.01a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v.01a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
    </svg>
  </button>
</header>

<div id="banner" role="status"><span id="bannerText"></span><button id="bannerAction" hidden></button></div>

<canvas id="sky" role="img"
        aria-label="Star map of your recent signals. Switch to List view for a text version."></canvas>

<div id="empty" aria-live="polite">
  <div class="inner">
    <h2 id="emptyTitle">The sky is empty</h2>
    <p id="emptyBody"></p>
  </div>
</div>

<!-- The legend and the filter are the same control: each row explains one visual
     encoding and switches it on as a filter. Pressed state is carried by
     aria-pressed, so the toggles announce themselves correctly. -->
<div class="legend" role="group" aria-label="Filter signals">
  <button class="row" id="fBig" aria-pressed="false" aria-label="Show only larger stars — higher relevance">
    <span class="lg-star big" aria-hidden="true"></span>
    <span class="txt">Larger — higher relevance</span>
  </button>
  <button class="row" id="fGold" aria-pressed="false" aria-label="Show only gold stars — 3 or more sources">
    <span class="lg-star gold" aria-hidden="true"></span>
    <span class="txt">Gold — 3+ sources (hot)</span>
  </button>
  <button class="row" id="fDim" aria-pressed="false" aria-label="Show only dimmer stars — older signals">
    <span class="lg-star faded" aria-hidden="true"></span>
    <span class="txt">Dimmer — older signal</span>
  </button>
  <div class="row note"><span class="lg-star tiny" aria-hidden="true"></span><span class="txt">Constellation = your topic</span></div>
</div>

<div class="nav">
  <button id="zin" aria-label="Zoom in">+</button>
  <button id="zout" aria-label="Zoom out">−</button>
  <button id="zreset" aria-label="Reset view" style="font-size:12px">⌂</button>
  <div class="hint" aria-hidden="true">scroll · drag<br>dbl-click reset</div>
</div>

<div id="tip" role="tooltip" aria-hidden="true">
  <div class="t-topic"></div>
  <div class="t-title"></div>
  <div class="t-meta"></div>
</div>

<!-- The head/body split exists so the head can be position:sticky. A signal's
     title is how you know which one you are reading; it should not scroll away
     while you are working through its member articles. -->
<aside id="panel" aria-label="Signal detail" role="dialog" aria-modal="false">
  <div class="p-head">
    <button class="p-close" aria-label="Close">×</button>
    <div class="p-topic"></div>
    <div class="p-hot"></div>
    <h2 class="p-title"></h2>
  </div>
  <div class="p-body">
    <div class="p-stats"></div>
    <p class="p-reason"></p>
    <div class="p-members"></div>
    <div class="p-srcs"></div>
    <a class="p-link" href="#" target="_blank" rel="noopener noreferrer">Open source article →</a>
  </div>
</aside>

<div id="list" role="tabpanel" aria-label="List view"><div class="lc" id="listContent"></div></div>

<script type="module" src="app.js"></script>
</body>
</html>
