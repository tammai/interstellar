<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interstellar</title>
<style>
  :root{ --space-0:#060A18; --ink:#C7D3EE; --ink-dim:#7787AE; --hot-gold:#FFC96B; --star-white:#EAF2FF; }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    background:var(--space-0);color:var(--ink);
    font-family:system-ui,sans-serif;
    display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;
  }
  .wordmark{font-size:26px;letter-spacing:.02em;color:var(--star-white);margin-bottom:10px}
  .wordmark .glyph{color:var(--hot-gold)}
  p{font-size:13.5px;color:var(--ink-dim);line-height:1.6;max-width:34ch}
</style>
</head>
<body>
  <div>
    <div class="wordmark"><span class="glyph">✦</span> Interstellar</div>
    <p>The sky is not built yet. This placeholder ships until the star map lands in M5.</p>
  </div>
</body>
</html>
