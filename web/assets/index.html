<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Interstellar — Sky</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="style.css">
<link rel="preload" href="fonts/NotoSans-variable.woff2" as="font" type="font/woff2" crossorigin>
</head>
<body>

<header>
  <h1 class="wordmark"><span class="glyph" aria-hidden="true">✦</span>Interstellar</h1>
  <div class="obs-date" id="obsDate"></div>
  <div class="spacer"></div>
  <!-- Refresh, and what the run is actually doing, both to the LEFT of the view
       toggle. The spinning icon on its own said only "something is happening": not
       which stage, not how much of the day's call budget it has spent, not that the
       instance cannot run at all. The Settings header has said all three for a while,
       and this is the screen you are looking at when you wonder.

       Text first, then the button: the status reads as the label of the control next
       to it, and the button stays adjacent to the toggle it belongs beside. The pair
       sits immediately after the spacer, so text appearing or growing eats the gap on
       its left and never pushes the toggle, Ask or Settings around. -->
  <div class="run-state" id="runState" aria-live="polite"></div>
  <button class="icon-btn" id="btnRefresh" aria-label="Refresh now" title="Refresh now">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/>
    </svg>
  </button>
  <div class="view-toggle" role="tablist" aria-label="View">
    <button id="btnSky" class="active" role="tab" aria-selected="true" aria-controls="sky">Sky</button>
    <button id="btnList" role="tab" aria-selected="false" aria-controls="list">List</button>
  </div>
  <!-- A real link, like the Ask button above it. Settings is its own document at
       /settings/, so the sky no longer loads 1700 lines of forms to draw a canvas,
       and the screen you are configuring is no longer hidden behind the screen you
       are configuring it from. -->
  <a class="icon-btn" id="btnSettings" href="settings/" aria-label="Settings" title="Settings">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="12" cy="12" r="3"/>
      <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h.01a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h.01a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v.01a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
    </svg>
  </a>
</header>

<div id="banner" role="status"><span id="bannerText"></span><button id="bannerAction" hidden></button></div>

<canvas id="sky" role="img"
        aria-label="Star map of your recent signals. Switch to List view for a text version."></canvas>

<div id="empty" aria-live="polite">
  <div class="inner">
    <h2 id="emptyTitle">The sky is empty</h2>
    <p id="emptyBody"></p>
  </div>
</div>

<!-- The legend and the filter are the same control: each row explains one visual
     encoding and switches it on as a filter. Pressed state is carried by
     aria-pressed, so the toggles announce themselves correctly. -->
<div class="legend" role="group" aria-label="Filter signals">
  <button class="row" id="fBig" aria-pressed="false" aria-label="Show only larger stars — higher relevance">
    <span class="lg-star big" aria-hidden="true"></span>
    <span class="txt">Larger — higher relevance</span>
  </button>
  <button class="row" id="fGold" aria-pressed="false" aria-label="Show only gold stars — 3 or more sources">
    <span class="lg-star gold" aria-hidden="true"></span>
    <span class="txt">Gold — 3+ sources (hot)</span>
  </button>
  <button class="row" id="fDim" aria-pressed="false" aria-label="Show only dimmer stars — older signals">
    <span class="lg-star faded" aria-hidden="true"></span>
    <span class="txt">Dimmer — older signal</span>
  </button>
  <div class="row note"><span class="lg-star tiny" aria-hidden="true"></span><span class="txt">Constellation = your topic</span></div>
</div>

<!-- Sky layers: the same overlay control as the legend, in the opposite corner.
     Each row names one thing the canvas draws and switches it off.

     Collapsed by default, unlike the legend, because six permanent rows here
     would sit on top of the upper-left constellation — the legend can be always-on
     at the bottom because nothing is laid out there. Rows are built in app.js from
     the Sky's own layer list, so a layer cannot exist in one place and not the other.

     Opened and closed by class, not by `hidden`: .rows declares a display, and an
     author display beats the UA [hidden] rule — the trap web/css.test.js exists to
     catch. -->
<div class="layers" id="layers" role="group" aria-label="Sky layers">
  <button class="row head" id="layersToggle" type="button" aria-expanded="false" aria-controls="layersList">
    <svg class="ly-caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="m9 6 6 6-6 6"/>
    </svg>
    <span class="txt">Layers</span>
  </button>
  <div class="rows" id="layersList"></div>
</div>

<!-- Inline SVG, matching the header's icon set: same 24x24 box, same 1.8 stroke,
     same currentColor. These were text characters, and the reset glyph U+2302 is
     not in the bundled Noto Sans subset — Chrome rendered it in Menlo, which is
     both why it needed a hand-written font-size to look right and why it would
     have been tofu on a machine without a system fallback for it. §6 requires the
     UI to render offline from bundled fonts; an icon must not depend on one. -->
<div class="nav">
  <button id="zin" aria-label="Zoom in">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M12 5v14M5 12h14"/>
    </svg>
  </button>
  <button id="zout" aria-label="Zoom out">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M5 12h14"/>
    </svg>
  </button>
  <button id="zreset" aria-label="Reset view">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M3 9.5 12 3l9 6.5V20a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/>
      <path d="M9.5 21v-7h5v7"/>
    </svg>
  </button>
  <div class="hint" aria-hidden="true">scroll · drag<br>dbl-click reset</div>
</div>

<div id="tip" role="tooltip" aria-hidden="true">
  <div class="t-topic"></div>
  <div class="t-title"></div>
  <div class="t-meta"></div>
</div>

<!-- The head/body split exists so the head can be position:sticky. A signal's
     title is how you know which one you are reading; it should not scroll away
     while you are working through its member articles. -->
<aside id="panel" aria-label="Signal detail" role="dialog" aria-modal="false">
  <div class="p-head">
    <button class="p-close" aria-label="Close">×</button>
    <div class="p-topic"></div>
    <div class="p-hot"></div>
    <h2 class="p-title"></h2>
  </div>
  <div class="p-body">
    <div class="p-stats"></div>
    <p class="p-reason"></p>
    <div class="p-members"></div>
    <div class="p-srcs"></div>
    <a class="p-link" href="#" target="_blank" rel="noopener noreferrer">Open source article →</a>
  </div>
</aside>

<div id="list" role="tabpanel" aria-label="List view"><div class="lc" id="listContent"></div></div>

<!-- Ask, as a dock at the bottom centre: the place every chat application puts its
     input, and a shape that says "type a question here" without a label. It replaces
     an icon button in a row of icon buttons, which said only "there is a feature".

     Still a LINK with no handler, exactly as the gear is. Typing here would mean the
     star map loading the chat screen's code, and that chat is a separate document
     loading none of sky.js is the entire point of it -- so the dock navigates, and
     the #ask fragment tells that page to put the caret in its composer. The click
     therefore lands where a click on a real input would.

     Placed after #panel on purpose: it is a sibling, so `#panel.open ~ .ask-dock`
     can take the dock out of the way of an open detail panel in CSS, with no
     JavaScript on this page knowing anything about either. -->
<a class="ask-dock" id="askDock" href="chat/#ask"
   aria-label="Ask a question about your signals" title="Ask a question about your signals">
  <svg class="ask-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 9.7 9.7 0 0 1-2.6-.4L4 21l1.6-4.2A8.3 8.3 0 0 1 3.6 11.5a8.4 8.4 0 0 1 9-8.4 8.4 8.4 0 0 1 8.4 8.4z"/>
  </svg>
  <span class="ask-ph">Ask about your signals…</span>
  <span class="ask-go" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M5 12h14M13 6l6 6-6 6"/>
    </svg>
  </span>
</a>

<script type="module" src="app.js"></script>
</body>
</html>
